<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Espalda</title>
<meta name="description" content="Diario de dolor de espalda, rutinas de gimnasio y estiramientos.">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B100E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Espalda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);}</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3v18"/><path d="M8 6h8M7.5 10h9M7.5 14h9M8 18h8"/></svg>
    </div>
    <div><h1>Mi Espalda</h1><small>Diario de dolor y entrenamiento</small></div>
  </div>
</header>

<main>
  <section class="view active" id="view-hoy" aria-label="Hoy"></section>
  <section class="view" id="view-gym" aria-label="Gimnasio"></section>
  <section class="view" id="view-stretch" aria-label="Estiramientos"></section>
  <section class="view" id="view-progress" aria-label="Progreso"></section>
</main>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-inner">
    <button data-tab="hoy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Hoy</button>
    <button data-tab="gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>Gimnasio</button>
    <button data-tab="stretch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7l-4 6M12 14l4 6M5 9l7 1 7-1"/></svg>Estiramientos</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Progreso</button>
  </div>
</nav>

<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/bodymap.js"></script>
<script src="js/figure.js"></script>
<script src="js/ex-gym.js"></script>
<script src="js/ex-stretch.js"></script>
<script src="js/routines.js"></script>
<script src="js/player.js"></script>
<script src="js/ui-log.js"></script>
<script src="js/ui-train.js"></script>
<script src="js/ui-progress.js"></script>
<script src="js/app.js"></script>
</body>
</html>
